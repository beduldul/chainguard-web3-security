<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChainGuard Interceptor</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&family=VT323&display=swap" rel="stylesheet">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background-color: #08090d;
      color: #00ff66;
      font-family: 'Fira Code', monospace;
      box-sizing: border-box;
      border: 2px solid #00ff66;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0, 255, 102, 0.3);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .title {
      font-weight: 700;
      font-size: 13px;
      color: #00ff66;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      background: #00ff66;
      color: #000000;
      border: 1px solid #00ff66;
    }
    .card {
      background: #0d1017;
      border: 1px solid #00ff66;
      padding: 12px;
      margin-bottom: 14px;
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.1);
    }
    .stat {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 8px;
      color: #a0aec0;
    }
    .stat-val {
      font-weight: 700;
      color: #00ff66;
    }
    .stat-val-amber {
      font-weight: 700;
      color: #ffb000;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: #00ff66;
      border: 1px solid #00ff66;
      color: #000000;
      font-family: 'Fira Code', monospace;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      text-transform: uppercase;
      box-sizing: border-box;
      transition: all 0.1s ease;
    }
    .btn:hover {
      background: #00cc52;
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
    }
    .btn:active {
      transform: scale(0.98);
    }
    .blinking-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: #00ff66;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ff66;
      animation: blink 1.2s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span class="blinking-dot"></span>
      <span>CHAINGUARD FIREWALL</span>
    </div>
    <span class="badge">[ACTIVE]</span>
  </div>

  <div class="card">
    <div class="stat">
      <span>Interceptor Daemon:</span>
      <span class="stat-val">HOOKED</span>
    </div>
    <div class="stat">
      <span>Drainers Blocked:</span>
      <span class="stat-val-amber">12 ATTEMPTS</span>
    </div>
    <div class="stat">
      <span>Network Shield:</span>
      <span class="stat-val">BASE + SOLANA</span>
    </div>
  </div>

  <button class="btn" id="openDashboard">$ ./open-dashboard.sh</button>

  <script src="popup.js"></script>
</body>
</html>
